      - NOVA_PROOFS_FILE=/nova_status/nova_proofs.jsonl
      - "NOVA_PATH_MAP=L:\\ZZZ ZZ NOVA GAME OUTPUT=/game_output;L:\\ZZZZZ ZZ 31-05-2026=/session"
    volumes:
      - "L:/!Nova V2/config:/config:ro"
      - "L:/!Nova V2/shared:/nova_shared:ro"
      - "L:/!Nova V2/status:/nova_status:rw"
      - "L:/ZZZZZ ZZ 31-05-2026/agents:/agents:ro"
      - "L:/ZZZZZ ZZ 31-05-2026:/session:ro"
