      - "L:/ZZZ ZZ NOVA GAME OUTPUT:/game_output:ro"
      - "L:/ZZZZZ ZZ 31-05-2026:/session:ro"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - nova-v2-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-v2:5432/${POSTGRES_DB}
      - NOTIFICATION_HUB_URL=http://nova-v2-notification-hub:8061
      - GATES_CONFIG=/config/quality_gates.yaml
      - NOVA_JURY_STATS_PATH=/nova_status/nova_jury_stats.json
      - NOVA_PROOFS_FILE=/nova_status/nova_proofs.jsonl
      - NOVA_PROOF_CHECK_PATH=/nova_status/nova_proof_check.json
      - "NOVA_PATH_MAP=L:\\ZZZ ZZ NOVA GAME OUTPUT=/game_output;L:\\ZZZZZ ZZ 31-05-2026=/session;L:\\!Nova V2\\state=/nova_state;L:\\!Nova V2\\status=/nova_status"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/health')"]
