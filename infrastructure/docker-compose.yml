      - NOVA_VAULT_TOKEN=${NOVA_VAULT_TOKEN}
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8144/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
    name: nova-v2-postgres-data
  redis-data:
    name: nova-v2-redis-data
  n8n-data:
    name: nova-v2-n8n-data
  minio-data:
    name: nova-v2-minio-data
  qdrant-data:
    name: nova-v2-qdrant-data
  vault-data:
    name: nova-v2-vault-data

networks:
  nova-v2-network:
    name: nova-v2-network
    driver: bridge
