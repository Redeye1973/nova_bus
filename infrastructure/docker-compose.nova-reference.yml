services:
  postgres-ref:
    image: pgvector/pgvector:pg16
    container_name: nova-v2-postgres-ref
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "timezone=UTC"
    environment:
      - POSTGRES_DB=nova_ref_db
      - POSTGRES_USER=nova_ref
      - POSTGRES_PASSWORD=${NOVA_REF_DB_PASS}
    ports:
      - "5440:5432"
    volumes:
      - ./data/postgres-ref:/var/lib/postgresql/data
      - ../nova-ref/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - nova-v2-network

  nova-ref:
    build:
      context: ../nova-ref
    container_name: nova-v2-nova-ref
    restart: unless-stopped
    ports:
      - "8400:8400"
    env_file:
      - C:/nova/secrets/nova-ref.env
    environment:
      - TZ=UTC
      - NOVA_REF_DB_HOST=postgres-ref
      - NOVA_REF_DB_PORT=5432
      - NOVA_REF_DB_NAME=nova_ref_db
      - NOVA_REF_DB_USER=nova_ref
      - NOVA_REF_DB_PASS=${NOVA_REF_DB_PASS:-changeme}
      - NOVA_REF_DB_POOL_MIN=2
      - NOVA_REF_DB_POOL_MAX=10
      - NOVA_REF_DB_POOL_IDLE_TIMEOUT=300
      - REDIS_URL=redis://redis-v2:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LEARN_SERVICE_URL=http://nova-learn:8401
      - SURILIANS_CODEX_PATH=/opt/nova/codex/surilians
    depends_on:
      - postgres-ref
      - redis-v2
    volumes:
      - ../codex:/opt/nova/codex:ro
    networks:
      - nova-v2-network

  nova-learn:
    build:
      context: ../nova-learn
    container_name: nova-v2-nova-learn
    restart: unless-stopped
    ports:
      - "8401:8401"
    env_file:
      - C:/nova/secrets/nova-learn.env
    environment:
      - TZ=UTC
      - NOVA_REF_DB_HOST=postgres-ref
      - NOVA_REF_DB_PORT=5432
      - NOVA_REF_DB_NAME=nova_ref_db
      - NOVA_REF_DB_USER=nova_ref
      - NOVA_REF_DB_PASS=${NOVA_REF_DB_PASS:-changeme}
      - NOVA_LEARN_DB_POOL_MIN=1
      - NOVA_LEARN_DB_POOL_MAX=5
      - NOVA_LEARN_DB_POOL_IDLE_TIMEOUT=300
      - REDIS_URL=redis://redis-v2:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - postgres-ref
      - redis-v2
      - nova-ref
    networks:
      - nova-v2-network
