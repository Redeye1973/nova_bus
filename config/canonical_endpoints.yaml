scripts:
  daystart: "L:\\!Nova V2\\scripts\\nova_dagstart.ps1"
  bridge_start: "L:\\!Nova V2\\scripts\\start_bridge.ps1"
  dale_black_ledger: "L:\\!Nova V2\\scripts\\run_dale_black_ledger.cmd"
  runtime_ports: "L:\\!Nova V2\\scripts\\nova_runtime_config.py"
